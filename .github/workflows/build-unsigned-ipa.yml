name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA on macOS runner
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos || true

      # No certificate or provisioning profile is needed: the script builds
      # with CODE_SIGNING_ALLOWED=NO and packs Payload/dekpop.app into an IPA.
      - name: Build unsigned IPA
        run: |
          set -o pipefail
          chmod +x scripts/build-unsigned-ipa.sh
          ./scripts/build-unsigned-ipa.sh 2>&1 | tee build.log

      - name: Verify IPA layout
        run: unzip -l dekpop-unsigned.ipa | grep 'Payload/dekpop.app/Info.plist'

      # Artifact + workflow logs need a login to download; a failed build's log
      # is published as a release asset so it stays readable without one.
      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="log-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" build.log \
            --title "build log ${GITHUB_RUN_NUMBER}" \
            --notes "xcodebuild output for ${GITHUB_SHA}" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dekpop-unsigned-ipa
          path: dekpop-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      # Also publish the IPA as a public release asset so it can be downloaded
      # without signing in to GitHub (artifacts always require a login).
      - name: Publish IPA to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dekpop-unsigned.ipa \
            --title "dekpop unsigned build ${GITHUB_RUN_NUMBER}" \
            --notes "Unsigned IPA built from ${GITHUB_SHA} — sign it before installing." \
            --latest

# To also produce a SIGNED IPA, add a step after "Build unsigned IPA" that
# decodes secrets (P12_BASE64, P12_PASSWORD, MOBILEPROVISION_BASE64) into
# RUNNER_TEMP, imports the certificate into a temporary keychain, and calls
# scripts/resign-ipa.sh. Only use a certificate your team owns and is licensed
# to distribute; never commit signing material. Fork PRs receive no secrets.
