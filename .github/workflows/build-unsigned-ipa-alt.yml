name: Build unsigned IPA (alternate runner)

# Manual fallback for times when the `macos-latest` pool is saturated and the
# primary workflow stays queued until GitHub cancels it. Trigger this from the
# Actions tab (or via workflow_dispatch) to use a different macOS runner pool.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA on macos-14
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos || true

      - name: Build unsigned IPA
        run: |
          chmod +x scripts/build-unsigned-ipa.sh
          ./scripts/build-unsigned-ipa.sh

      - name: Verify IPA layout
        run: unzip -l dekpop-unsigned.ipa | grep 'Payload/dekpop.app/Info.plist'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dekpop-unsigned-ipa
          path: dekpop-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
